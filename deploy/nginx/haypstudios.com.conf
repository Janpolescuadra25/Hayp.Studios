# ==============================================================================
# HAYP STUDIOS (haypstudios.com) — PRODUCTION NGINX REVERSE PROXY SPECIFICATION
# Target Server: Hetzner VPS "vortex" (2.28.120.85)
# Target Path on Server: /etc/nginx/sites-available/haypstudios.com.conf
#
# ARCHITECTURE NOTE:
# - Local repo reverse proxy remains native Caddy (targeting localhost:3000).
# - Production VPS runtime (ecosystem.config.cjs) runs Next.js on port 3003.
# - This configuration terminates SSL and proxies traffic to 127.0.0.1:3003.
# ==============================================================================

upstream hayp_studios_upstream {
    server 127.0.0.1:3003;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# HTTP -> HTTPS Redirection (Port 80)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name haypstudios.com www.haypstudios.com;

    # ACME Challenge location for Certbot renewals
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# HTTPS Reverse Proxy (Port 443)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name haypstudios.com www.haypstudios.com;

    # SSL Certificate Paths (Target paths on VPS)
    ssl_certificate /etc/letsencrypt/live/haypstudios.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/haypstudios.com/privkey.pem;

    # SSL Security & Optimization
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Client Request Buffers
    client_max_body_size 25M;
    client_body_buffer_size 128k;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Static Asset Caching for Next.js Build Artifacts
    location /_next/static/ {
        proxy_pass http://hayp_studios_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Public Static Files
    location ~* \.(ico|jpg|jpeg|png|gif|svg|webp|woff|woff2|ttf|eot)$ {
        proxy_pass http://hayp_studios_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Main Application Proxy Route
    location / {
        proxy_pass http://hayp_studios_upstream;
        proxy_http_version 1.1;

        # WebSocket & Upgrade Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard Forwarding Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Proxy Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
