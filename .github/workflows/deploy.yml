name: Production Deployment CI/CD
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  test-and-build:
    name: Test & Build Verification Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install Dependencies
        run: bun install --frozen-lockfile || bun install
      - name: Run Dependency Vulnerability Audit
        run: |
          bun audit --json --audit-level critical > security-audit.json || true
          node -e "const fs=require('fs'); const data=JSON.parse(fs.readFileSync('security-audit.json','utf8')); const advisories = data && Array.isArray(data.advisories) ? data.advisories : []; if (advisories.length) { console.error('CRITICAL advisory gate failed'); process.exit(1); }"
      - name: Run Test Suite
        run: bun test
      - name: Compile Production Build
        run: bun run build
  deploy:
    name: Production Deploy to Hetzner VPS (vortex)
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 2.28.120.85
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e
            echo "=== Starting Production Deployment for Hayp Studios ==="
            cd /var/www/haypstudios
            git fetch origin main
            git reset --hard origin/main
            bun install --frozen-lockfile || bun install
            bun run build
            pm2 restart hayp-frontend --update-env
            echo "=== Production Deployment Completed Successfully ==="
